name: Build firmware

on:
  push:
    branches: ['v[0-9]*.[0-9]*']        # v1.0, v1.1, v2.0 ... (not main, not version1)
    paths-ignore: ['firmware/**', '**.md']
  workflow_dispatch:                    # manual "Run workflow" button (use it for a brand new branch if nothing started)

permissions:
  contents: write

concurrency:
  group: gchess-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.ref_name }}
      MANIFEST_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the next version automatically
        shell: bash
        run: |
          set -euo pipefail
          cfg=src/gchess_config.h
          HW=$(grep -E '^[[:space:]]*#define[[:space:]]+GC_HW[[:space:]]+"' "$cfg" | head -n1 | sed -E 's/.*GC_HW[[:space:]]+"([^"]*)".*/\1/')
          [[ "$HW" =~ ^[A-Za-z0-9]+$ ]]        || { echo "::error::GC_HW '$HW' is invalid"; exit 1; }
          [[ "$BRANCH" =~ ^v[0-9]+\.[0-9]+$ ]] || { echo "::error::Branch '$BRANCH' is not vX.Y"; exit 1; }
          XY="${BRANCH#v}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$MANIFEST_BRANCH"
          git worktree add -B "$MANIFEST_BRANCH" "$RUNNER_TEMP/mf" "origin/$MANIFEST_BRANCH"

          # newest patch already published for this X.Y, plus one (a brand new branch starts at X.Y.0)
          VER=$(python3 - "$RUNNER_TEMP/mf/manifest.json" "$XY" <<'PY'
          import json, sys
          try:
              m = json.load(open(sys.argv[1]))
          except FileNotFoundError:
              m = {}
          p = [int(e["v"].split(".")[2]) for e in m.get("versions", []) if e["v"].rsplit(".", 1)[0] == sys.argv[2]]
          print(sys.argv[2] + "." + str(max(p) + 1 if p else 0))
          PY
          )
          echo "Next version: $VER (hw $HW)"

          # Put it into the source INSIDE the runner only (this change is never committed)
          sed -i -E 's|(#define[[:space:]]+GC_VERSION[[:space:]]+)"[^"]*"|\1"'"$VER"'"|' "$cfg"
          grep -q "GC_VERSION[[:space:]]*\"$VER\"" "$cfg" || { echo "::error::could not write version into $cfg"; exit 1; }

          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "HW=$HW"   >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Build
        run: |
          pip install -U platformio
          pio run -e esp32dev

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          SRC=.pio/build/esp32dev/firmware.bin
          test -s "$SRC" || { echo "::error::$SRC missing"; exit 1; }
          DEST="firmware/gchess_${VER}.bin"
          SHA=$(sha256sum "$SRC" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$SRC")
          if [ -f "$DEST" ] && [ "$(sha256sum "$DEST" | cut -d' ' -f1)" != "$SHA" ]; then
            echo "::error::$DEST already exists with a different sha256. Bump GC_VERSION."
            exit 1
          fi
          mkdir -p firmware
          cp "$SRC" "$DEST"
          echo "SHA=$SHA"   >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/${DEST}" >> "$GITHUB_ENV"

      - name: Commit binary to this branch
        shell: bash
        run: |
          set -euo pipefail
          git add -f "firmware/gchess_${VER}.bin"
          if git diff --cached --quiet; then
            echo "Binary already committed."
          else
            git commit -m "firmware: gchess_${VER}.bin sha256=${SHA:0:12} [skip ci]"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

      - name: Publish manifest.json + latest.json
        shell: bash
        run: |
          set -euo pipefail
          M="$RUNNER_TEMP/mf"
          for i in 1 2 3 4 5; do
            python3 scripts/update_manifest.py --manifest "$M/manifest.json" \
              --version "$VER" --hw "$HW" --url "$URL" --sha256 "$SHA" --size "$SIZE" --commit "$GITHUB_SHA"
            git -C "$M" add manifest.json latest.json
            if git -C "$M" diff --cached --quiet; then echo "Already up to date."; break; fi
            git -C "$M" commit -m "manifest: gchess ${VER} (hw ${HW}) [skip ci]"
            if git -C "$M" push origin "HEAD:${MANIFEST_BRANCH}"; then break; fi
            echo "Push rejected, retry $i/5"
            git -C "$M" fetch origin "$MANIFEST_BRANCH"
            git -C "$M" reset --hard "origin/$MANIFEST_BRANCH"
            [ "$i" -lt 5 ] || { echo "::error::Could not update manifest"; exit 1; }
          done

      - name: Summary
        run: |
          { echo "### gchess ${VER} (hw ${HW})"; echo "- sha256: \`${SHA}\`"; echo "- size: ${SIZE}"; echo "- url: ${URL}"; } >> "$GITHUB_STEP_SUMMARY"