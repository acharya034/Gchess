name: Build firmware

on:
  push:
    branches: ['v[0-9]*.[0-9]*']        # v1.0, v1.1, v2.0 ... (not main, not version1)
    paths-ignore: ['**.md']
  workflow_dispatch:                    # manual "Run workflow" button (for a brand new branch if nothing started)

permissions:
  contents: read                        # this repo is only read; the firmware repo is written with FIRMWARE_TOKEN

concurrency:
  group: gchess-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.ref_name }}
      FW_REPO: acharya034/Gchess-firmware
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout firmware repo
        uses: actions/checkout@v4
        with:
          repository: acharya034/Gchess-firmware
          ref: main
          token: ${{ secrets.FIRMWARE_TOKEN }}
          path: fw

      - name: Pick the next version automatically
        shell: bash
        run: |
          set -euo pipefail
          cfg=src/gchess_config.h
          HW=$(grep -E '^[[:space:]]*#define[[:space:]]+GC_HW[[:space:]]+"' "$cfg" | head -n1 | sed -E 's/.*GC_HW[[:space:]]+"([^"]*)".*/\1/')
          [[ "$HW" =~ ^[A-Za-z0-9]+$ ]]        || { echo "::error::GC_HW '$HW' is invalid"; exit 1; }
          [[ "$BRANCH" =~ ^v[0-9]+\.[0-9]+$ ]] || { echo "::error::Branch '$BRANCH' is not vX.Y"; exit 1; }
          XY="${BRANCH#v}"

          VER=$(python3 - "fw/manifest.json" "$XY" <<'PY'
          import json, sys
          try:
              m = json.load(open(sys.argv[1]))
          except FileNotFoundError:
              m = {}
          p = [int(e["v"].split(".")[2]) for e in m.get("versions", []) if e["v"].rsplit(".", 1)[0] == sys.argv[2]]
          print(sys.argv[2] + "." + str(max(p) + 1 if p else 0))
          PY
          )
          echo "Next version: $VER (hw $HW)"

          # write it into the source inside the runner only (never committed)
          sed -i -E 's|(#define[[:space:]]+GC_VERSION[[:space:]]+)"[^"]*"|\1"'"$VER"'"|' "$cfg"
          grep -q "GC_VERSION[[:space:]]*\"$VER\"" "$cfg" || { echo "::error::could not write version into $cfg"; exit 1; }

          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "HW=$HW"   >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Build
        run: |
          pip install -U platformio
          pio run -e esp32dev

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          SRC=.pio/build/esp32dev/firmware.bin
          test -s "$SRC" || { echo "::error::$SRC missing"; exit 1; }
          cp "$SRC" "$RUNNER_TEMP/gchess_${VER}.bin"
          REL="firmware/${BRANCH}/gchess_${VER}.bin"
          echo "REL=$REL" >> "$GITHUB_ENV"
          echo "BIN=$RUNNER_TEMP/gchess_${VER}.bin" >> "$GITHUB_ENV"
          echo "SHA=$(sha256sum "$SRC" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c %s "$SRC")" >> "$GITHUB_ENV"
          echo "URL=https://raw.githubusercontent.com/${FW_REPO}/main/${REL}" >> "$GITHUB_ENV"

      - name: Publish firmware + manifest.json + latest.json
        shell: bash
        run: |
          set -euo pipefail
          git -C fw config user.name  "github-actions[bot]"
          git -C fw config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            mkdir -p "fw/$(dirname "$REL")"
            cp "$BIN" "fw/$REL"
            python3 scripts/update_manifest.py --manifest fw/manifest.json \
              --version "$VER" --hw "$HW" --url "$URL" --sha256 "$SHA" --size "$SIZE" --commit "$GITHUB_SHA"
            git -C fw add -A
            if git -C fw diff --cached --quiet; then echo "Already up to date."; break; fi
            git -C fw commit -m "gchess ${VER} (hw ${HW}) from ${BRANCH}"
            if git -C fw push origin HEAD:main; then break; fi
            echo "Push rejected, retry $i/5"
            git -C fw fetch origin main
            git -C fw reset --hard origin/main
            [ "$i" -lt 5 ] || { echo "::error::Could not publish to $FW_REPO"; exit 1; }
          done

      - name: Summary
        run: |
          { echo "### gchess ${VER} (hw ${HW})"; echo "- sha256: \`${SHA}\`"; echo "- size: ${SIZE}"; echo "- url: ${URL}"; } >> "$GITHUB_STEP_SUMMARY"